<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070a"/><stop offset=".6" stop-color="#0b1022"/><stop offset="1" stop-color="#05070a"/></linearGradient>
<linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#1e90ff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="glow" cx=".18" cy=".5" r=".35"><stop offset="0" stop-color="#1e90ff" stop-opacity=".35"/><stop offset="1" stop-color="#1e90ff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e90ff" stroke-opacity=".07"/></pattern>
<style>
.px{fill:#22d3ee;animation:f 3s ease-in-out infinite}
.px:nth-child(2n){animation-delay:.7s}.px:nth-child(3n){animation-delay:1.4s}
@keyframes f{0%,100%{opacity:.15}50%{opacity:.9}}
.in{animation:up 1s ease-out both}.d2{animation-delay:.3s}.d3{animation-delay:.6s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.f{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
</style>
<clipPath id="c"><rect x="80" y="55" width="190" height="190" rx="28"/></clipPath></defs>
<rect width="1200" height="300" fill="url(#bg)"/>
<rect width="1200" height="300" fill="url(#grid)"/>
<rect width="1200" height="300" fill="url(#glow)"/>
<g>
<rect class="px" x="1040" y="40" width="10" height="10"/><rect class="px" x="1058" y="40" width="10" height="10"/><rect class="px" x="1076" y="58" width="10" height="10"/>
<rect class="px" x="1094" y="40" width="10" height="10"/><rect class="px" x="1112" y="76" width="10" height="10"/><rect class="px" x="1130" y="58" width="10" height="10"/>
<rect class="px" x="1058" y="236" width="10" height="10"/><rect class="px" x="1094" y="254" width="10" height="10"/><rect class="px" x="1130" y="236" width="10" height="10"/>
</g>
<image clip-path="url(#c)" x="80" y="55" width="190" height="190" href="data:image/jpeg;base64,"/>
<rect x="80" y="55" width="190" height="190" rx="28" fill="none" stroke="#1e90ff" stroke-opacity=".45" stroke-width="2"/>
<g class="in"><text x="340" y="128" class="f" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="2">PIXEL <tspan fill="url(#t)">SYNTAX</tspan></text></g>
<g class="in d2"><text x="342" y="172" class="f" font-size="24" fill="#22d3ee">Custom Software · CRM · Web Apps · AI Automation</text></g>
<g class="in d3"><text x="342" y="214" class="f" font-size="18" fill="#a1a1aa">Dubai, UAE  ·  pixelsyntax.store  ·  Code today for a smarter tomorrow</text></g>
<rect x="342" y="236" width="120" height="4" rx="2" fill="url(#t)"/>
</svg>